[project]
name = "adrobot-keitaro"
version = "1.0.0"
description = "AdRobot: создаватор и редактор кампаний Keitaro (FastAPI + SQLAlchemy)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "jinja2>=3.1.4,<4.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "anyio>=4.4",
    "ruff>=0.5",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: тесты против настоящего Keitaro (нужен KEITARO_API_KEY)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
# Рядом лежит каталог миграций `alembic/` — без подсказки ruff принял бы пакет alembic за «свой».
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["app"]
