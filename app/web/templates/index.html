<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AdRobot · Keitaro</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#app">К содержимому</a>

  <header class="topbar">
    <a class="brand" href="#/campaigns" aria-label="AdRobot — к списку кампаний">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 16h9l7-9h10M12 16l7 9h10" fill="none" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="16" r="3.2" fill="var(--amber)"/>
      </svg>
      <span class="brand__name">AdRobot</span>
      <span class="brand__sub">обёртка над Keitaro</span>
    </a>
    <nav class="nav" aria-label="Разделы">
      <a class="nav__link" href="#/campaigns" data-route="campaigns">Кампании</a>
      <a class="nav__link" href="#/new" data-route="new">Новая кампания</a>
      <a class="nav__link" href="#/log" data-route="log">Журнал</a>
      <a class="nav__link" href="#/settings" data-route="settings">Настройки</a>
    </nav>
    <div class="topbar__side">
      <a class="lamp-link" href="#/settings" id="health" title="Проверяю связь с Keitaro…">
        <span class="lamp lamp--off" aria-hidden="true"></span>
        <span class="lamp-link__text">Keitaro: проверка…</span>
      </a>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1"></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript><p class="noscript">Интерфейсу нужен JavaScript. API доступно без него: <a href="/docs">/docs</a>.</p></noscript>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
